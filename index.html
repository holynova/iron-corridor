<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="铁甲回廊 Iron Corridor — 坦克大战 × Roguelike 网页游戏" />
    <title>铁甲回廊 · Iron Corridor</title>
    <style>
      :root {
        --ink: #0b0f14;
        --steel: #171f27;
        --amber: #ffb028;
        --rust: #e0532a;
        --mint: #6fe3b0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: #e8eef3;
        font-family: 'KenneyFuture', 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      #game canvas { display: block; }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 50% 0%, #1b2631 0%, #0b0f14 62%),
            repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 12px, transparent 12px 24px);
        z-index: 50;
        transition: opacity 0.45s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .mark {
        font-size: clamp(28px, 6vw, 56px);
        letter-spacing: 0.16em;
        color: var(--amber);
        text-shadow: 0 3px 0 #6d2f12, 0 0 26px rgba(255, 176, 40, 0.35);
      }
      #boot .sub { letter-spacing: 0.42em; font-size: 12px; color: #7f93a4; }
      #boot .bar {
        width: min(340px, 70vw);
        height: 12px;
        border: 2px solid #2b3946;
        background: #0e141a;
        padding: 2px;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 12%;
        background: linear-gradient(90deg, var(--rust), var(--amber));
        transition: width 0.25s ease;
      }
      #boot .tip { font-size: 11px; color: #56697a; max-width: 70vw; text-align: center; line-height: 1.7; }
      #boot .err { color: #ff7a5c; font-size: 12px; max-width: 80vw; text-align: center; line-height: 1.6; }
      noscript { color: #ff7a5c; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="mark">铁甲回廊</div>
      <div class="sub">IRON CORRIDOR</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="tip" id="boot-tip">正在铸造战车…</div>
    </div>
    <noscript>本游戏需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
